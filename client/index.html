<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ebe4d4" />
    <title>Aduna</title>
    <script src="/theme-init.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg, #fbf8f1); color: var(--head, #14110d); overflow: hidden; }
      .boot-wrap { position: relative; width: 220px; height: 120px; display: grid; place-items: center; animation: boot-in .5s ease-out both; }
      .boot-mark, .boot-word { grid-area: 1 / 1; background: currentColor; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; mask-position: center; -webkit-mask-position: center; mask-size: contain; -webkit-mask-size: contain; animation-duration: 3.6s; animation-iteration-count: infinite; animation-delay: var(--boot-d, 0s); }
      .boot-mark { width: 62px; height: 62px; -webkit-mask-image: url(/aduna-icon.png); mask-image: url(/aduna-icon.png); animation-name: boot-icon; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
      .boot-word { width: 190px; height: 60px; opacity: 0; -webkit-mask-image: url(/aduna-wordmark.png); mask-image: url(/aduna-wordmark.png); animation-name: boot-text; animation-timing-function: cubic-bezier(.65, 0, .35, 1); }
      .boot-ring { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: boot-pulse 3.6s ease-out infinite; animation-delay: var(--boot-d, 0s); }
      .boot-ring.b { animation-delay: calc(var(--boot-d, 0s) + 1.8s); }
      .boot-bar { position: absolute; left: 50%; top: calc(50% + 86px); width: 120px; height: 3px; margin-left: -60px; border-radius: 2px; background: color-mix(in srgb, currentColor 14%, transparent); overflow: hidden; animation: boot-in .5s .15s ease-out both; }
      .boot-bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: currentColor; animation: boot-slide 1.3s cubic-bezier(.65, 0, .35, 1) infinite; }
      .boot.resume .boot-wrap, .boot.resume .boot-bar { animation: none; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
      /* the icon floats, squashes away, and the word "Aduna" opens out of the same spot; then it folds back into the icon */
      @keyframes boot-icon { 0% { opacity: 1; transform: translateY(0) scale(1); } 15% { transform: translateY(-4px) scale(1); } 30% { opacity: 1; transform: translateY(0) scale(1); } 40% { opacity: 0; transform: scale(.45) rotate(-14deg); } 88% { opacity: 0; transform: scale(.45) rotate(-14deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes boot-text { 0%, 34% { opacity: 0; clip-path: inset(0 47% 0 47%); transform: scale(.8); } 50% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); } 80% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); } 92%, 100% { opacity: 0; clip-path: inset(0 47% 0 47%); transform: scale(.8); } }
      @keyframes boot-pulse { 0% { transform: scale(.55); opacity: .3; } 50%, 100% { transform: scale(1.5); opacity: 0; } }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot *, .boot { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } .boot-ring { display: none; } .boot-bar i { width: 100%; opacity: .4; } }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/pwa.js" defer></script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Aduna"><div class="boot-wrap"><span class="boot-ring"></span><span class="boot-ring b"></span><span class="boot-mark"></span><span class="boot-word"></span></div><div class="boot-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
