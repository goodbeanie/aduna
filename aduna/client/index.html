<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ebe4d4" />
    <title>Aduna</title>
    <script src="/theme-init.js"></script>
    <style>
      html, body { margin: 0; height: 100%; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg, #fbf8f1); color: var(--head, #14110d); overflow: hidden; }
      .boot-wrap { position: relative; width: 120px; height: 120px; display: grid; place-items: center; animation: boot-in .5s ease-out both; }
      .boot-mark { width: 62px; height: 62px; background: currentColor; -webkit-mask: url(/aduna-icon.png) center / contain no-repeat; mask: url(/aduna-icon.png) center / contain no-repeat; animation: boot-float 2.4s ease-in-out infinite; }
      .boot-ring { position: absolute; inset: 14px; border-radius: 50%; border: 2px solid currentColor; opacity: 0; animation: boot-pulse 2.4s ease-out infinite; }
      .boot-ring.b { animation-delay: 1.2s; }
      .boot-bar { position: absolute; left: 50%; top: calc(50% + 86px); width: 120px; height: 3px; margin-left: -60px; border-radius: 2px; background: color-mix(in srgb, currentColor 14%, transparent); overflow: hidden; animation: boot-in .5s .15s ease-out both; }
      .boot-bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: currentColor; animation: boot-slide 1.3s cubic-bezier(.65, 0, .35, 1) infinite; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes boot-pulse { 0% { transform: scale(.55); opacity: .35; } 100% { transform: scale(1.5); opacity: 0; } }
      @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot *, .boot { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } .boot-ring { display: none; } .boot-bar i { width: 100%; opacity: .4; } }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/pwa.js" defer></script>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading Aduna"><div class="boot-wrap"><span class="boot-ring"></span><span class="boot-ring b"></span><span class="boot-mark"></span></div><div class="boot-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
