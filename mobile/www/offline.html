<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aduna</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#fffbef;color:#111112;font-family:Georgia,serif;text-align:center;padding:24px;box-sizing:border-box}
  main{max-width:340px}
  h1{font-weight:400;font-size:28px;margin:0 0 10px}
  p{color:#6d675a;font-size:18px;line-height:1.4;margin:0 0 22px}
  button{font:inherit;font-size:19px;height:50px;padding:0 30px;border-radius:30px;border:2px solid #111112;background:#111112;color:#fffbef}
</style>
</head>
<body>
<main>
  <h1>Can’t reach Aduna</h1>
  <p>Check your connection and try again. If the server was asleep it can take a minute to wake up.</p>
  <button onclick="location.replace('https://aduna.onrender.com/app')">Try again</button>
</main>
</body>
</html>
