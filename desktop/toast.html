<!doctype html>
<meta charset="utf-8">
<title>Aduna notification</title>
<style>
  @font-face { font-family: "Bree Serif"; src: url(build/bree-serif.woff2) format("woff2"); font-display: swap; }
  :root {
    /* Parchment defaults; the real values are streamed in from the page so cards always match the current theme (server themes included). */
    --bg: #fbf8f1; --raised: #fffdf8; --text: #2a251e; --head: #14110d; --muted: #857b6a; --line: #e2d9c4; --hover: #eee7d6;
    --danger: #b8442f; --green: #3f8f5b; --ink: #1c1812; --on-ink: #fbf8f1;
    --font: "Bree Serif", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #stack { width: 388px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 14px; cursor: pointer;
    background: var(--raised); color: var(--text); font: 14px/1.35 var(--font);
    box-shadow: 0 8px 28px rgba(0,0,0,.24), inset 0 0 0 1px var(--line);
    animation: in .28s cubic-bezier(.2,.8,.2,1) both; transition: opacity .2s ease, transform .2s ease;
  }
  .card:hover { background: color-mix(in srgb, var(--head) 4%, var(--raised)); }
  .card.out { opacity: 0; transform: translateX(24px); }
  .card.swap { animation: none; }
  @keyframes in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  .ico { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--on-ink); }
  .card.call .ico { background: var(--green); color: #fff; animation: ring 1s ease-in-out infinite; }
  .ico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes ring { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
  .txt { min-width: 0; flex: 1; padding-right: 14px; }
  .title { color: var(--head); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .body { margin-top: 3px; color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .x { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); padding: 0; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .12s, background-color .12s; }
  .card:hover .x { opacity: 1; }
  .x:hover { background: var(--hover); color: var(--head); }
  .x svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  @media (prefers-reduced-motion: reduce) { .card, .card.call .ico { animation: none; } }
</style>
<div id="stack"></div>
<script>
  var root = document.documentElement, stack = document.getElementById('stack');
  var cards = new Map(), MAX = 4, SHOW_MS = 7000, HOVER_MS = 3000;
  var G = {
    chat: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h7A2.5 2.5 0 0 1 16 5.5v5a2.5 2.5 0 0 1-2.5 2.5H9l-3.5 3v-3A2.5 2.5 0 0 1 4 10.5z"/>',
    at: '<circle cx="10" cy="10" r="3"/><path d="M13 10v1.2a2 2 0 0 0 4 0V10a7 7 0 1 0-2.8 5.6"/>',
    horn: '<path d="M3 8.5v3l9 4V4.5zM12 7.5a3 3 0 0 1 0 5M5 12l1 4"/>',
    phone: '<path d="M5 3.5h2.6l1.3 3.2-1.7 1.1a9 9 0 0 0 4 4l1.1-1.7 3.2 1.3V14a2 2 0 0 1-2 2A11.5 11.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
    user: '<circle cx="8" cy="7" r="3"/><path d="M2.5 16c.4-3 2.6-4.5 5.5-4.5M14 8v5M11.5 10.5h5"/>',
    bell: '<path d="M5 14V9a5 5 0 0 1 10 0v5l1.5 1.5h-13zM8.5 17.5h3"/>'
  };
  var KIND = { dm: 'chat', mention: 'at', announcement: 'horn', call: 'phone', friend: 'user' };
  var X = '<svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg>';

  function report() { adunaToast.size(388, cards.size ? stack.offsetHeight : 0); }
  function blip() { // one quiet tone per new card (calls ring inside the app already)
    try {
      var c = blip.ctx || (blip.ctx = new (window.AudioContext || window.webkitAudioContext)());
      var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
      o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1175, t + 0.09);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.28);
    } catch (e) { /* no audio */ }
  }
  function arm(c, ms) {
    clearTimeout(c.timer);
    if (!c.sticky) c.timer = setTimeout(function () { remove(c.id, true); }, ms);
  }
  function fill(c, t) {
    c.sticky = !!t.sticky;
    c.el.className = 'card ' + (t.kind || '') + (c.el.classList.contains('swap') ? ' swap' : '');
    c.el.querySelector('.ico').innerHTML = '<svg viewBox="0 0 20 20">' + G[KIND[t.kind] || 'bell'] + '</svg>';
    c.el.querySelector('.title').textContent = t.title || 'Aduna';
    var b = c.el.querySelector('.body'); b.textContent = t.body || ''; b.hidden = !t.body;
  }
  function add(t) {
    var c = cards.get(t.id);
    if (c) { c.el.classList.add('swap'); fill(c, t); arm(c, SHOW_MS); report(); return; } // same tag: update in place
    var el = document.createElement('div');
    el.innerHTML = '<div class="ico"></div><div class="txt"><div class="title"></div><div class="body"></div></div><button class="x" aria-label="Dismiss">' + X + '</button>';
    c = { id: t.id, el: el, timer: 0, sticky: false };
    el.onclick = function () { adunaToast.open(c.id); remove(c.id, true); };
    el.querySelector('.x').onclick = function (e) { e.stopPropagation(); remove(c.id, true); };
    el.onmouseenter = function () { clearTimeout(c.timer); };
    el.onmouseleave = function () { arm(c, HOVER_MS); };
    cards.set(t.id, c); stack.appendChild(el); fill(c, t); arm(c, SHOW_MS);
    while (cards.size > MAX) remove(cards.keys().next().value, true, true); // oldest makes room
    if (t.kind !== 'call') blip();
    report();
  }
  function remove(id, tell, instant) {
    var c = cards.get(id); if (!c) return;
    cards.delete(id); clearTimeout(c.timer);
    if (tell) adunaToast.gone(id);
    var done = function () { c.el.remove(); report(); };
    if (instant) done(); else { c.el.classList.add('out'); setTimeout(done, 200); }
    if (!cards.size) setTimeout(report, 230);
  }
  adunaToast.onAdd(add);
  adunaToast.onRemove(function (id) { remove(id, false); });
  adunaToast.onTheme(function (vars) {
    for (var k in vars) root.style.setProperty(k, vars[k]);
  });
</script>
