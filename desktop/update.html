<!doctype html>
<meta charset="utf-8">
<title>Aduna update</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font:14px system-ui,'Segoe UI',sans-serif;user-select:none}
  .card{box-sizing:border-box;margin:6px;height:calc(100vh - 12px);display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:#fffbef;color:#111112;border:1px solid #e7dfc8;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28)}
  img{width:40px;height:40px;flex:none;object-fit:contain}
  h1{margin:0 0 2px;font-size:15px}
  p{margin:0 0 10px;color:#6d675a}
  .row{display:flex;gap:8px}
  button{font:inherit;font-weight:600;border:0;border-radius:9px;padding:7px 14px;cursor:pointer}
  .go{background:#e0b04a;color:#111112}.go:hover{background:#d4a23a}
  .later{background:transparent;color:#6d675a}.later:hover{color:#111112}
</style>
<div class="card">
  <img src="build/icon.png" alt="">
  <div>
    <h1>Update ready</h1>
    <p id="msg">A new version of Aduna is ready to install.</p>
    <div class="row"><button class="go" id="go">Restart &amp; update</button><button class="later" id="later">Later</button></div>
  </div>
</div>
<script>
  var v = new URLSearchParams(location.search).get('v');
  if (v) document.getElementById('msg').textContent = 'Aduna ' + v + ' is ready to install.';
  document.getElementById('go').onclick = function () { this.disabled = true; this.textContent = 'Updating…'; adunaUpdate.act('install'); };
  document.getElementById('later').onclick = function () { adunaUpdate.act('later'); };
</script>
