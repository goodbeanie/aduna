# Builds the Android app. Run it from the Actions tab > "Build Android app" > Run workflow, then download the artifact.
#  - With the signing secrets set (see mobile/README.md): a signed release APK (to install directly) and AAB (for Google Play).
#  - Without them: an installable debug APK for testing only.
name: Build Android app
on: workflow_dispatch
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      ADUNA_VERSION_CODE: ${{ github.run_number }}
      ADUNA_VERSION_NAME: 1.0.${{ github.run_number }}
      ADUNA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ADUNA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ADUNA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Signing key
        env: { KS_B64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/aduna.keystore"
            echo "ADUNA_KEYSTORE=$RUNNER_TEMP/aduna.keystore" >> "$GITHUB_ENV"
            echo "ADUNA_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this builds an unsigned-for-store debug APK (testing only)."
          fi
      - name: Create the Android project
        run: node scripts/prepare-android.mjs
      - name: Build signed release (APK + AAB)
        if: env.ADUNA_SIGNED == '1'
        working-directory: mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Build debug APK
        if: env.ADUNA_SIGNED != '1'
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aduna-Android
          path: |
            mobile/android/app/build/outputs/apk/**/*.apk
            mobile/android/app/build/outputs/bundle/**/*.aab
