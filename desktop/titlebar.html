<!doctype html>
<meta charset="utf-8">
<title>Aduna</title>
<style>
  @font-face { font-family: "Bree Serif"; src: url(build/bree-serif.woff2) format("woff2"); font-display: swap; }
  :root {
    /* Parchment defaults; the real values are streamed in from the page so the bar always matches the current theme. */
    --bg3: #ebe4d4; --line: #e2d9c4; --head: #14110d; --muted: #857b6a; --hover: #e1d9c4; --danger: #b8442f;
    --font: "Bree Serif", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg3); user-select: none; -webkit-user-select: none; }
  .bar { height: 100%; display: flex; align-items: stretch; justify-content: space-between; background: var(--bg3); color: var(--head); font: 14px/1 var(--font); -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 9px; padding-left: 14px; min-width: 0; opacity: 1; transition: opacity .15s; }
  .brand img { width: 18px; height: 18px; object-fit: contain; display: block; }
  .brand span { font-size: 14px; letter-spacing: .2px; }
  .ctl { display: flex; align-items: stretch; -webkit-app-region: no-drag; }
  .ctl button { width: 46px; border: 0; background: transparent; color: var(--head); display: grid; place-items: center; padding: 0; cursor: default; transition: background-color .12s, color .12s; }
  .ctl button:hover { background: var(--hover); }
  .ctl button:active { background: var(--line); }
  .ctl button.close:hover { background: var(--danger); color: #fff; }
  .ctl button.close:active { background: var(--danger); color: #fff; filter: brightness(.9); }
  .ctl svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .ctl button.scan { width: 40px; color: var(--muted); }
  .ctl button.scan:hover { color: var(--head); }
  .ctl button.scan svg { width: 15px; height: 15px; }
  .sep { width: 1px; margin: 9px 6px; background: var(--line); -webkit-app-region: no-drag; }
  /* window not focused: dim everything a little, like native title bars */
  body.blur .brand, body.blur .ctl button { opacity: .55; }
  /* maximize / restore swap */
  .ctl svg.ico-restore { display: none; }
  body.max .ctl svg.ico-max { display: none; }
  body.max .ctl svg.ico-restore { display: block; }
</style>
<div class="bar">
  <div class="brand"><img src="build/icon.png" alt=""><span>Aduna</span></div>
  <div class="ctl">
    <button class="scan" id="ai" title="AI Coder" aria-label="AI Coder">
      <svg viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5"/><path d="M10.5 4.5L14 8l-3.5 3.5"/><path d="M9 3.2L7 12.8"/></svg>
    </button>
    <button class="scan" id="scan" title="Check for updates" aria-label="Check for updates">
      <svg viewBox="0 0 16 16"><path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3"/><path d="M12.4 1.6v3h-3"/></svg>
    </button>
    <div class="sep"></div>
    <button id="min" title="Minimize" aria-label="Minimize">
      <svg viewBox="0 0 10 10" style="width:10px;height:10px"><path d="M1.2 5.5h7.6"/></svg>
    </button>
    <button id="max" title="Maximize" aria-label="Maximize">
      <svg class="ico-max" viewBox="0 0 10 10" style="width:10px;height:10px"><rect x="1.4" y="1.4" width="7.2" height="7.2" rx="1.7"/></svg>
      <svg class="ico-restore" viewBox="0 0 10 10" style="width:10px;height:10px"><rect x="1.3" y="3.3" width="5.4" height="5.4" rx="1.4"/><path d="M3.5 2.9V2.8A1.4 1.4 0 0 1 4.9 1.4H7.2A1.4 1.4 0 0 1 8.6 2.8V5.1A1.4 1.4 0 0 1 7.2 6.5H7"/></svg>
    </button>
    <button id="close" class="close" title="Close" aria-label="Close">
      <svg viewBox="0 0 10 10" style="width:10px;height:10px"><path d="M1.8 1.8l6.4 6.4M8.2 1.8L1.8 8.2"/></svg>
    </button>
  </div>
</div>
<script>
  var root = document.documentElement;
  var send = function (name) { return function () { adunaBar.act(name); }; };
  document.getElementById('min').onclick = send('min');
  document.getElementById('max').onclick = send('max');
  document.getElementById('close').onclick = send('close');
  document.getElementById('scan').onclick = send('check');
  document.getElementById('ai').onclick = send('ai');
  adunaBar.onTheme(function (vars) {
    for (var k in vars) root.style.setProperty(k, vars[k]);
    // the logo is black; flip it on dark themes (same trick the app's home button uses)
    var m = /^#([0-9a-f]{6})$/i.exec((vars['--bg3'] || '').trim());
    if (m) { var n = parseInt(m[1], 16), l = 0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255); document.querySelector('.brand img').style.filter = l < 110 ? 'invert(1)' : ''; }
  });
  adunaBar.onState(function (s) {
    document.body.classList.toggle('max', !!s.maximized);
    document.body.classList.toggle('blur', s.focused === false);
    document.getElementById('max').title = s.maximized ? 'Restore' : 'Maximize';
  });
</script>
